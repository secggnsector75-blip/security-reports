<style>

    --ink:#1b2430;
    --ink-soft:#4a5568;
    --line:#d8dce3;
    --line-soft:#e8eaef;
    --paper:#f6f7f9;
    --panel:#ffffff;
    --brand:#0f4c5c;
    --brand-deep:#0a3540;
    --amber:#c17a1f;
    --amber-soft:#fbeed9;
    --ok:#2f7d4f;
    --warn:#b3431e;
    --radius:6px;
    font-family: "Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--paper); color:var(--ink);
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;

    background:var(--brand-deep); color:#eef3f2; padding:18px 28px;
    display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:14px;
    border-bottom:3px solid var(--amber);
  }
  header.top .titleblock h1{
    margin:0; font-size:19px; letter-spacing:.2px; font-weight:700;
  }
  header.top .titleblock p{
    margin:2px 0 0; font-size:12.5px; color:#b9d2cf;
  }
  .top-controls{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  .top-controls label{ font-size:12px; color:#cfe3e0; margin-right:4px; }
  .top-controls input[type=date], .top-controls select{
    padding:7px 9px; border-radius:5px; border:1px solid #1c5b6c; background:#0d4453; color:#fff; font-size:13px;
  }
  nav.tabs{
    display:flex; gap:0; background:var(--brand); padding:0 28px;
  }
  nav.tabs button{
    background:transparent; border:none; color:#d7e8e6; padding:12px 22px; font-size:14px;

  main{ max-width:1180px; margin:24px auto 90px; padding:0 20px; }
  .panel{ display:none; }
  .panel.active{ display:block; }

    background:var(--panel); border:1px solid var(--line); border-radius:var(--radius);
    margin-bottom:18px; overflow:hidden;
  }
  section.card > .card-head{
    background:#eef3f3; padding:11px 16px; border-bottom:1px solid var(--line);
    display:flex; align-items:center; justify-content:space-between;
  }

  .field input:focus, .field select:focus, .field textarea:focus{ outline:2px solid var(--brand); outline-offset:0; border-color:var(--brand); }

  .table-scroll{ overflow-x:auto; -webkit-overflow-scrolling:touch; border-radius:4px; }
  table.grid th{
    background:#f0f2f5; color:var(--ink-soft); text-align:left; padding:7px 8px; border:1px solid var(--line-soft);
    font-weight:700; white-space:nowrap;
  }
  table.grid td{ padding:4px 6px; border:1px solid var(--line-soft); vertical-align:middle; }
  table.grid td input, table.grid td select{
    width:100%; border:1px solid transparent; background:transparent; padding:5px 4px; font-size:12.8px; border-radius:4px;
  }
  table.grid td input:focus, table.grid td select:focus{ background:#fff; border-color:var(--brand); outline:none; }
  table.grid tr:hover td{ background:#fafbfc; }
  .computed{ font-weight:700; color:var(--brand-deep); }
  .row-actions{ text-align:center; width:36px; }
  .row-actions button{
    background:none; border:none; color:var(--warn); font-size:16px; cursor:pointer; line-height:1;
  }
  .add-row-btn{
    margin-top:10px; background:#eef3f3; border:1px dashed var(--brand); color:var(--brand-deep);
    padding:7px 12px; border-radius:5px; font-size:12.5px; cursor:pointer; font-weight:600;

  .add-row-btn:hover{ background:var(--amber-soft); border-color:var(--amber); }

  .flag-cell select{ text-align:center; }

  footer.bar{
    position:fixed; bottom:0; left:0; right:0; background:var(--panel); border-top:1px solid var(--line);
    padding:12px 24px; display:flex; align-items:center; justify-content:space-between; gap:14px; flex-wrap:wrap;
    box-shadow:0 -2px 10px rgba(0,0,0,.04);
  }
  .bar-status{ font-size:12px; color:var(--ink-soft); }
  .bar-note{ font-size:10.5px; color:#9aa3b2; margin-top:2px; }
  .bar-actions{ display:flex; gap:10px; }
  button.primary{
    background:var(--brand); color:#fff; border:none; padding:10px 20px; border-radius:5px; font-size:13.5px;
    font-weight:700; cursor:pointer; letter-spacing:.2px;
  }
  button.primary:hover{ background:var(--brand-deep); }
  button.secondary{
    background:#fff; color:var(--brand-deep); border:1px solid var(--brand); padding:10px 16px; border-radius:5px;
    font-size:13.5px; font-weight:600; cursor:pointer;

  .note{ font-size:11.5px; color:#8a93a3; margin-top:8px; }
  .two-col{ display:grid; grid-template-columns:1fr 1fr; gap:18px; }

    .two-col{ grid-template-columns:1fr; }
    header.top{ padding:14px 16px; }
    header.top .titleblock h1{ font-size:16px; }
    header.top .titleblock p{ display:none; }
    .top-controls{ width:100%; }
    .top-controls > div{ flex:1 1 auto; }
    .top-controls input[type=date], .top-controls select{ width:100%; }
    nav.tabs{ padding:0 10px; }
    nav.tabs button{ padding:11px 12px; font-size:13px; flex:1; }
    main{ margin:16px auto 130px; padding:0 10px; }
    section.card > .card-body{ padding:12px; }
    .field-grid{ grid-template-columns:1fr 1fr; gap:10px 12px; }
    footer.bar{ flex-direction:column; align-items:stretch; padding:10px 14px; gap:8px; }
    .bar-status{ text-align:center; }
    .bar-actions{ flex-direction:column; }
    .bar-actions button{ width:100%; }
    table.grid{ font-size:12px; }
  }
  @media (max-width:420px){
    .field-grid{ grid-template-columns:1fr; }
  }
</style>

<script>
/* ---------------------------------------------------------------------
   Storage polyfill — this app is designed to run both as a Claude
   artifact (window.storage provided by the host) and as a fully
   standalone HTML file (emailed, hosted, opened from disk). If no
   host storage API is present, fall back to the browser's own
   localStorage so drafts still save on that device.
--------------------------------------------------------------------- */
if (!window.storage) {
  window.storage = {
    async get(key){
      const raw = localStorage.getItem('kvs:'+key);
      if(raw === null) throw new Error('not found');
      return { key, value: raw, shared:false };
    },
    async set(key, value){
      localStorage.setItem('kvs:'+key, value);
      return { key, value, shared:false };
    },
    async delete(key){
      localStorage.removeItem('kvs:'+key);
      return { key, deleted:true, shared:false };
    },
    async list(prefix){
      const keys = [];
      for(let i=0;i<localStorage.length;i++){
        const k = localStorage.key(i);
        if(k && k.startsWith('kvs:')){
          const bare = k.slice(4);
          if(!prefix || bare.startsWith(prefix)) keys.push(bare);
        }
      }
      return { keys, prefix, shared:false };
    }
  };
}
</script>
<script>
/* ---------------------------------------------------------------------
   Static template data (mirrors the original DSR / PTR workbooks)
--------------------------------------------------------------------- */
const FIRE_SAFETY_DEFAULTS = [
  ['Fire Alarm Panel','BMS Room',1,'Ops','-'],
  ['FHC - Ground Level','Total Cabinets',16,'Ops','-'],
  ['FHC - Ground Level','Hose Pipes',32,'Available','-'],
  ['FHC - Ground Level','Nozzles',2,'Available on Main Gate','-'],
  ['FHC - Basement','Total Cabinets',5,'Ops','-'],
  ['FHC - Basement','Hose Pipes',10,'Available','-'],
  ['FHC - Basement','Nozzles',1,'Available in BMS','-'],
  ['Fire Extinguishers','WATER 9 LTR',3,'','NEW'],
  ['Fire Extinguishers','FOAM 45 LTR',6,'','NEW'],
  ['Fire Extinguishers','FOAM 9.0 LTR',5,'','NEW'],
  ['Fire Extinguishers','DCP 2.0 KG (ABC)',5,'Refilled: Feb 2025','-'],
  ['Fire Extinguishers','DCP 4.0 KG (ABC)',13,'Refilled: Feb 2025 / Jun 2025','-'],
  ['Fire Extinguishers','DCP 6.0 KG (ABC)',10,'Refilled: Feb 2025','-'],
  ['Fire Extinguishers','CO2 22.5 KG',5,'-','-'],
  ['Fire Extinguishers','CO2 4.5 KG',35,'Refilled: Feb 2025 / Jun 2025','-'],
];
const LABOUR_COMPANIES = ['PFMPL (RSP)','MPPL','Allubuild','ANJ','APPL','MOON WALK'];
const PARKING_ROWS = ['4 Wheelers Parked','2 Wheelers Parked','4/2 W Identified','4/2 W Unidentified'];
const PARKING_COLS = ['Total Day','Total Night','Basement Day','Basement Night','Block-D Day','Block-D Night','Block-F Day','Block-F Night'];
const PTR_ZONES = [
  [1,'Block -A','Entry/Exit And all Parking Area'],
  [2,'Block -A','Terrace Fire Exit'],
  [3,'Block -A','New Reception Area'],
  [4,'Block -A','STP Area'],
  [5,'Main Entry','AITA Main Entry'],
  [6,'Block -B','CT PT Area'],
  [7,'Block -B, C','B&C Connecting Bridge Area'],
  [8,'Block -B','Terrace Fire Exit'],
  [9,'Block -C','Terrace Fire Exit'],
  [10,'Block-G','Garden Area'],
  [11,'Block-E','Terrace Fire Exit'],
  [12,'Block-D','LT Panel Room Area'],
  [13,'Block-D','Terrace Lift Lobby'],
  [14,'Block-D','Terrace Fire Exit'],
  [15,'Block-F','Terrace Lift Lobby'],
  [16,'Block-F','Terrace Fire Exit 1'],
  [17,'Block-F','Terrace Fire Exit 2'],
  [18,'Block-F','Warehouse'],
  [19,'Basement-A','Driver Room Side'],
  [20,'Basement-B','Office Area Block-B Fire Exit'],
  [21,'Basement-C','Pump Room'],
  [22,'Basement-DG','Staff Washroom Area'],
];

function todayISO(){ return new Date().toISOString().slice(0,10); }
function fmtDisplayDate(iso){
  if(!iso) return '';
  const [y,m,d]=iso.split('-'); return `${d}-${m}-${y}`;
}

/* ---------------------------------------------------------------------
   Default state factories
--------------------------------------------------------------------- */
function defaultDSR(){
  return {
    reportPeriod:'',
    manpower:{
      morning:{ approvedSup:2, approvedGuards:38, deployedSup:'', deployedGuards:'', overtime:'' },
      night:{ approvedSup:2, approvedGuards:34, deployedSup:'', deployedGuards:'', overtime:'' },
    },
    hsd: [ {date:'',location:'',quantity:'',time:'',challan:'',vehicle:'',vendor:''} ],
    fireSafety: FIRE_SAFETY_DEFAULTS.map(r=>({equipmentType:r[0],location:r[1],quantity:r[2],status:r[3],remarks:r[4]})),
    incidents: [],
    cctv:{
      old:{ installed:54, working:54, notWorking:0, backup:'7-10 Days', remarksInstalled:'Installed & Configured', remarksWorking:'All Operational', remarksNotWorking:'Nil', remarksBackup:'Average 7 Days' },
      new:{ installed:84, working:84, notWorking:0, backup:'1 Month', remarksInstalled:'Installed & Configured', remarksWorking:'All Operational', remarksNotWorking:'Nil', remarksBackup:'Up to one month' },
    },
    labour: LABOUR_COMPANIES.map(name=>({company:name, labours:'', staff:''})),
    parking: PARKING_ROWS.map(()=>({ totalDay:'',totalNight:'',basementDay:'',basementNight:'',blockDDay:'',blockDNight:'',blockFDay:'',blockFNight:'',remarks:'' })),
    lighting:{ stp:'', nonTower:'', blockBC:'', blockD:'', blockEG:'', blockF:'', informTo:'', informBy:'', remarks:'' },
    summary:{ preparedBy:'', additionalInfo:'' },
    actionRequired: [],
  };
}
function defaultPTRShift(){
  return {
    ptrName:'',
    verifiedBy:'',
    updatedBy:'',
    zones: PTR_ZONES.map(z=>({ no:z[0], zone:z[1], area:z[2], slot1:'', slot2:'', slot3:'', blocked:'N', poorLighting:'N', remarks:'' })),
  };
}
function defaultPTR(){
  return { morning: defaultPTRShift(), night: defaultPTRShift() };
}

/* ---------------------------------------------------------------------
   App state
--------------------------------------------------------------------- */
let state = { date: todayISO(), dsr: defaultDSR(), ptr: defaultPTR() };
let currentTab = 'dsr';
let currentPTRShift = 'morning';
let saveTimer = null;

function getPath(obj, path){
  return path.split('.').reduce((o,k)=> (o==null?o:o[isNaN(k)?k:Number(k)]), obj);
}
function setPath(obj, path, value){
  const keys = path.split('.');
  let o = obj;
  for(let i=0;i<keys.length-1;i++){
    const k = isNaN(keys[i]) ? keys[i] : Number(keys[i]);
    o = o[k];
  }
  const lastKey = keys[keys.length-1];
  o[isNaN(lastKey)?lastKey:Number(lastKey)] = value;
}

/* ---------------------------------------------------------------------
   Storage
--------------------------------------------------------------------- */
async function saveDraft(silent){
  try{
    await window.storage.set('dsr:'+state.date, JSON.stringify(state.dsr));
    await window.storage.set('ptr:'+state.date, JSON.stringify(state.ptr));
    document.getElementById('statusMsg').textContent = 'Saved draft for ' + fmtDisplayDate(state.date) + ' at ' + new Date().toLocaleTimeString();
    if(!silent) refreshLoadList();
  }catch(e){
    document.getElementById('statusMsg').textContent = 'Could not save draft: ' + e;
  }
}
function scheduleAutosave(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(()=>saveDraft(true), 900);
}
// If a save is pending when the user switches dates (or navigates away),
// write it immediately under the CURRENT date before anything else can
// reassign state.date / state.dsr / state.ptr out from under it. Without
// this, edits made in the last ~900ms before switching dates were silently
// lost — the delayed autosave would fire after state already pointed at
// the new date and re-save that date's own data as a no-op.
async function flushAutosave(){
  if(saveTimer){
    clearTimeout(saveTimer);
    saveTimer = null;
    await saveDraft(true);
  }
}
// If a saved PTR draft was created under an older version of PTR_ZONES
// (different zones/areas or a different count), rebuild its zone list from
// the CURRENT template so the checklist always reflects the latest zones.
// Any slot times / flags / remarks already entered are preserved for zones
// whose Zone+Area text still matches; anything else starts blank.
function zoneListMatchesTemplate(zones){
  if(!Array.isArray(zones) || zones.length !== PTR_ZONES.length) return false;
  for(let i=0;i<PTR_ZONES.length;i++){
    if(!zones[i] || zones[i].zone !== PTR_ZONES[i][1] || zones[i].area !== PTR_ZONES[i][2]) return false;
  }
  return true;
}
function migrateShiftZones(shift){
  if(zoneListMatchesTemplate(shift.zones)) return;
  const old = Array.isArray(shift.zones) ? shift.zones : [];
  shift.zones = PTR_ZONES.map(z=>{
    const match = old.find(o=>o && o.zone===z[1] && o.area===z[2]);
    return {
      no: z[0], zone: z[1], area: z[2],
      slot1: match?.slot1||'', slot2: match?.slot2||'', slot3: match?.slot3||'',
      blocked: match?.blocked||'N', poorLighting: match?.poorLighting||'N', remarks: match?.remarks||'',
    };
  });
}
function migratePTR(ptr){
  migrateShiftZones(ptr.morning);
  migrateShiftZones(ptr.night);
  return ptr;
}
async function loadDraft(dateISO){
  let dsr = defaultDSR(), ptr = defaultPTR();
  try{
    const r = await window.storage.get('dsr:'+dateISO);
    if(r && r.value) dsr = JSON.parse(r.value);
  }catch(e){}
  try{
    const r = await window.storage.get('ptr:'+dateISO);
    if(r && r.value) ptr = JSON.parse(r.value);
  }catch(e){}
  ptr = migratePTR(ptr);
  state.date = dateISO;
  state.dsr = dsr;
  state.ptr = ptr;
  renderAll();
  document.getElementById('statusMsg').textContent = 'Loaded ' + fmtDisplayDate(dateISO) + '.';
}
async function refreshLoadList(){
  const sel = document.getElementById('loadPrevious');
  sel.innerHTML = '<option value="">Choose a date&hellip;</option>';
  try{
    const list = await window.storage.list('dsr:');
    if(list && list.keys){
      const dates = list.keys.map(k=>k.replace('dsr:','')).sort().reverse();
      dates.forEach(d=>{
        const opt = document.createElement('option');
        opt.value = d; opt.textContent = fmtDisplayDate(d);
        sel.appendChild(opt);
      });
    }
  }catch(e){}
}

/* ---------------------------------------------------------------------
   Rendering — DSR
--------------------------------------------------------------------- */
function renderDSR(){
  const d = state.dsr;
  const mm = d.manpower.morning, mn = d.manpower.night;
  const totalApprovedM = (Number(mm.approvedSup)||0)+(Number(mm.approvedGuards)||0);
  const totalApprovedN = (Number(mn.approvedSup)||0)+(Number(mn.approvedGuards)||0);
  const totalDeployedM = (Number(mm.deployedSup)||0)+(Number(mm.deployedGuards)||0);
  const totalDeployedN = (Number(mn.deployedSup)||0)+(Number(mn.deployedGuards)||0);
  const supShortM = Math.max((Number(mm.approvedSup)||0)-(Number(mm.deployedSup)||0),0);
  const guardShortM = Math.max((Number(mm.approvedGuards)||0)-(Number(mm.deployedGuards)||0),0);
  const supShortN = Math.max((Number(mn.approvedSup)||0)-(Number(mn.deployedSup)||0),0);
  const guardShortN = Math.max((Number(mn.approvedGuards)||0)-(Number(mn.deployedGuards)||0),0);

  const fireTotal = d.fireSafety.reduce((s,r)=> r.equipmentType==='Fire Extinguishers' ? s+(Number(r.quantity)||0) : s, 0);
  const camTotal = (Number(d.cctv.old.installed)||0)+(Number(d.cctv.new.installed)||0);
  const labourTotalL = d.labour.reduce((s,r)=>s+(Number(r.labours)||0),0);
  const labourTotalS = d.labour.reduce((s,r)=>s+(Number(r.staff)||0),0);
  const labourTotalP = labourTotalL + labourTotalS;

  const html = `
  <section class="card">
    <div class="card-head"><h2>Report period</h2></div>
    <div class="card-body">
      <div class="field-grid">
        <div class="field"><label>Report Period</label>
          <input type="text" placeholder="e.g. 04-Sep-2026, 06:00 to 06:00 hrs" data-bind="reportPeriod" value="${esc(d.reportPeriod)}"></div>
      </div>
    </div>
  </section>

  <section class="card">
    <div class="card-head"><h2>1. Security manpower</h2></div>
    <div class="card-body">
      <table class="grid">
        <thead><tr>
          <th>Shift</th><th>Approved Sup</th><th>Approved Guards</th><th>Total Approved</th>
          <th>Deployed Sup</th><th>Deployed Guards</th><th>Overtime</th><th>Total Deployed</th>
          <th>Sup Shortfall</th><th>Guard Shortfall</th>
        </tr></thead>
        <tbody>
          <tr>
            <td>Morning</td>
            <td><input type="number" min="0" data-bind="manpower.morning.approvedSup" value="${mm.approvedSup}"></td>
            <td><input type="number" min="0" data-bind="manpower.morning.approvedGuards" value="${mm.approvedGuards}"></td>
            <td class="computed" data-calc="totalApprovedM">${totalApprovedM}</td>
            <td><input type="number" min="0" data-bind="manpower.morning.deployedSup" value="${mm.deployedSup}"></td>
            <td><input type="number" min="0" data-bind="manpower.morning.deployedGuards" value="${mm.deployedGuards}"></td>
            <td><input type="number" min="0" data-bind="manpower.morning.overtime" value="${mm.overtime}"></td>
            <td class="computed" data-calc="totalDeployedM">${totalDeployedM}</td>
            <td class="computed" data-calc="supShortM">${supShortM}</td>
            <td class="computed" data-calc="guardShortM">${guardShortM}</td>
          </tr>
          <tr>
            <td>Night</td>
            <td><input type="number" min="0" data-bind="manpower.night.approvedSup" value="${mn.approvedSup}"></td>
            <td><input type="number" min="0" data-bind="manpower.night.approvedGuards" value="${mn.approvedGuards}"></td>
            <td class="computed" data-calc="totalApprovedN">${totalApprovedN}</td>
            <td><input type="number" min="0" data-bind="manpower.night.deployedSup" value="${mn.deployedSup}"></td>
            <td><input type="number" min="0" data-bind="manpower.night.deployedGuards" value="${mn.deployedGuards}"></td>
            <td><input type="number" min="0" data-bind="manpower.night.overtime" value="${mn.overtime}"></td>
            <td class="computed" data-calc="totalDeployedN">${totalDeployedN}</td>
            <td class="computed" data-calc="supShortN">${supShortN}</td>

/* ---------------------------------------------------------------------
   Generic binding + recompute helper for DSR (re-renders whole panel
   on change so all computed totals stay correct; inputs restore focus
   via cursor position where practical)
--------------------------------------------------------------------- */
function bindInputs(container, section, rerenderFn){
  container.querySelectorAll('[data-bind]').forEach(el=>{
    const evt = (el.tagName==='SELECT') ? 'change' : 'input';
    el.addEventListener(evt, ()=>{
      const target = state[section];
      setPath(target, el.getAttribute('data-bind'), el.value);
      scheduleAutosave();
      // Only fully re-render on blur-safe events to avoid focus loss while typing numbers;
      // computed fields are refreshed live via a lightweight recompute pass.
      liveRecomputeDSR();
    });
    el.addEventListener('change', ()=>{ rerenderFn(); });
  });
}
function liveRecomputeDSR(){
  const d = state.dsr;
  const mm = d.manpower.morning, mn = d.manpower.night;
  const totalApprovedM = (Number(mm.approvedSup)||0)+(Number(mm.approvedGuards)||0);
  const totalApprovedN = (Number(mn.approvedSup)||0)+(Number(mn.approvedGuards)||0);
  const totalDeployedM = (Number(mm.deployedSup)||0)+(Number(mm.deployedGuards)||0);
  const totalDeployedN = (Number(mn.deployedSup)||0)+(Number(mn.deployedGuards)||0);
  const supShortM = Math.max((Number(mm.approvedSup)||0)-(Number(mm.deployedSup)||0),0);
  const guardShortM = Math.max((Number(mm.approvedGuards)||0)-(Number(mm.deployedGuards)||0),0);
  const supShortN = Math.max((Number(mn.approvedSup)||0)-(Number(mn.deployedSup)||0),0);
  const guardShortN = Math.max((Number(mn.approvedGuards)||0)-(Number(mn.deployedGuards)||0),0);
  setCalc('totalApprovedM',totalApprovedM); setCalc('totalDeployedM',totalDeployedM);
  setCalc('supShortM',supShortM); setCalc('guardShortM',guardShortM);
  setCalc('totalApprovedN',totalApprovedN); setCalc('totalDeployedN',totalDeployedN);
  setCalc('supShortN',supShortN); setCalc('guardShortN',guardShortN);

  // grand total row (morning + night combined)
  setCalc('grandApprovedSup', (Number(mm.approvedSup)||0)+(Number(mn.approvedSup)||0));
  setCalc('grandApprovedGuards', (Number(mm.approvedGuards)||0)+(Number(mn.approvedGuards)||0));
  setCalc('grandTotalApproved', totalApprovedM+totalApprovedN);
  setCalc('grandDeployedSup', (Number(mm.deployedSup)||0)+(Number(mn.deployedSup)||0));
  setCalc('grandDeployedGuards', (Number(mm.deployedGuards)||0)+(Number(mn.deployedGuards)||0));
  setCalc('grandOvertime', (Number(mm.overtime)||0)+(Number(mn.overtime)||0));
  setCalc('grandTotalDeployed', totalDeployedM+totalDeployedN);
  setCalc('grandSupShort', supShortM+supShortN);
  setCalc('grandGuardShort', guardShortM+guardShortN);

  const fireTotal = d.fireSafety.reduce((s,r)=> r.equipmentType==='Fire Extinguishers' ? s+(Number(r.quantity)||0) : s, 0);
  setCalc('fireTotal', fireTotal);
  const camTotal = (Number(d.cctv.old.installed)||0)+(Number(d.cctv.new.installed)||0);
  setCalc('camTotal', camTotal);
  const labourTotalL = d.labour.reduce((s,r)=>s+(Number(r.labours)||0),0);
  const labourTotalS = d.labour.reduce((s,r)=>s+(Number(r.staff)||0),0);
  const labourTotalP = labourTotalL + labourTotalS;
  setCalc('labourTotalP', labourTotalP); setCalc('labourTotalL', labourTotalL); setCalc('labourTotalS', labourTotalS);
  // refresh per-row personnel (labours+staff) and % , now that the true total is known
  d.labour.forEach((r,i)=>{
    const personnel = (Number(r.labours)||0)+(Number(r.staff)||0);
    const pct = labourTotalP>0 ? Math.round((personnel/labourTotalP)*1000)/10 : 0;
    setCalc('labourPersonnel.'+i, personnel);
    setCalc('labourPct.'+i, pct+'%');
  });
}
function setCalc(name, value){
  const el = document.querySelector(`[data-calc="${name}"]`);
  if(el) el.textContent = value;
}
function esc(v){
  if(v===undefined || v===null) return '';
  return String(v).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/'/g,'&#39;').replace(/</g,'&lt;');
}
function wrapTablesForScroll(container){
  container.querySelectorAll('table.grid').forEach(tbl=>{
    if(tbl.parentElement && tbl.parentElement.classList.contains('table-scroll')) return;
    const wrap = document.createElement('div');
    wrap.className = 'table-scroll';
    tbl.parentNode.insertBefore(wrap, tbl);
    wrap.appendChild(tbl);
  });
}

/* ---------------------------------------------------------------------
   Excel export (ExcelJS — full style support: fills, fonts, borders)
--------------------------------------------------------------------- */
const THEME = {
  titleFill: 'FF1F4E78',   titleFont: 'FFFFFFFF',
  sectionFill: 'FF1F4E78', sectionFont: 'FFFFFFFF',
  headerFill: 'FF5B9BD5',  headerFont: 'FFFFFFFF',
  totalLabelFill: 'FFF2F2F2', totalValueFill: 'FF92D050', totalFont: 'FF1B2430',
  bandFill: 'FFF7F9FB',
  flagFill: 'FFFBE1DE',    flagFont: 'FFB3431E',
  border: { style:'thin', color:{argb:'FF000000'} },
  headFontName: 'Calibri',
  dataFontName: 'Aptos Narrow',
};
function thinBorder(){ return { top:THEME.border, left:THEME.border, bottom:THEME.border, right:THEME.border }; }

function styleTitleRow(ws, rowNum, lastCol){
  ws.mergeCells(rowNum,1,rowNum,lastCol);
  const row = ws.getRow(rowNum);
  row.height = 28;
  const cell = row.getCell(1);
  cell.font = { name:THEME.headFontName, bold:true, size:16, color:{argb:THEME.titleFont} };
  cell.fill = { type:'pattern', pattern:'solid', fgColor:{argb:THEME.titleFill} };
  cell.alignment = { vertical:'middle', horizontal:'center' };
  cell.border = thinBorder();
  for(let c=1;c<=lastCol;c++){
    row.getCell(c).fill = { type:'pattern', pattern:'solid', fgColor:{argb:THEME.titleFill} };
  }
}
function styleSectionRow(ws, rowNum, lastCol, text){
  ws.mergeCells(rowNum,1,rowNum,lastCol);
  const row = ws.getRow(rowNum);
  row.height = 21;
  const cell = row.getCell(1);
  cell.value = text;
  cell.font = { name:THEME.headFontName, bold:true, size:11, color:{argb:THEME.sectionFont} };
  cell.fill = { type:'pattern', pattern:'solid', fgColor:{argb:THEME.sectionFill} };
  cell.alignment = { vertical:'middle', horizontal:'center' };
  cell.border = thinBorder();
  for(let c=1;c<=lastCol;c++){
    row.getCell(c).fill = { type:'pattern', pattern:'solid', fgColor:{argb:THEME.sectionFill} };
  }
}
function styleHeaderRow(ws, rowNum, lastCol){
  const row = ws.getRow(rowNum);
  row.height = 20;
  for(let c=1;c<=lastCol;c++){
    const cell = row.getCell(c);
    cell.font = { name:THEME.headFontName, bold:true, size:11, color:{argb:THEME.headerFont} };
    cell.fill = { type:'pattern', pattern:'solid', fgColor:{argb:THEME.headerFill} };
    cell.border = thinBorder();
    cell.alignment = { vertical:'middle', horizontal:'center', wrapText:true };
  }
}
function styleDataRow(ws, rowNum, lastCol, opts){
  opts = opts || {};
  const leftCols = opts.leftAlignCols || [];
  const row = ws.getRow(rowNum);
  for(let c=1;c<=lastCol;c++){
    const cell = row.getCell(c);
    cell.border = thinBorder();
    cell.font = Object.assign({ name:THEME.dataFontName, size:11 }, cell.font||{});
    cell.alignment = { vertical:'middle', horizontal: leftCols.includes(c) ? 'left' : 'center', wrapText:true };
    if(opts.band) cell.fill = { type:'pattern', pattern:'solid', fgColor:{argb:THEME.bandFill} };
    if(opts.bold) cell.font = Object.assign({}, cell.font, {bold:true});
    if(opts.total){
      const isLabel = (c===1);
      cell.fill = { type:'pattern', pattern:'solid', fgColor:{argb: isLabel ? THEME.totalLabelFill : THEME.totalValueFill} };
      cell.font = Object.assign({}, cell.font, { bold:true, color:{argb:THEME.totalFont} });
    }
  }
}
function flagCell(ws, rowNum, colNum, value){
  const cell = ws.getRow(rowNum).getCell(colNum);
  cell.alignment = { vertical:'middle', horizontal:'center' };
  if(value === 'Y'){
    cell.fill = { type:'pattern', pattern:'solid', fgColor:{argb:THEME.flagFill} };
    cell.font = { bold:true, color:{argb:THEME.flagFont} };
  }
}
async function downloadWorkbook(wb, filename){
  const buffer = await wb.xlsx.writeBuffer();
  const blob = new Blob([buffer], { type:'application/octet-stream' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
function num(v){ const n = Number(v); return isNaN(n) || v===''||v===null||v===undefined ? null : n; }
function F(formula){ return { formula }; }

  styleDataRow(ws, R, 5, {band:true}); R++;
  ws.getRow(R).values = ['Total Installed Cameras', F(`B${camRow}+D${camRow}`)];
  styleDataRow(ws, R, 5, {total:true}); R+=2;

  // 6. Labour
  styleSectionRow(ws, R, LAST, '6. LABOUR MOVEMENT'); R++;

  // 7. Parking

  // Summary

async function exportPTR(){
  const wb = new ExcelJS.Workbook();
  const ws = wb.addWorksheet('PTR', { views:[{ showGridLines:false }] });
  ws.pageSetup = { orientation:'landscape', fitToPage:true, fitToWidth:1, fitToHeight:0, margins:{left:0.3,right:0.3,top:0.4,bottom:0.4,header:0.2,footer:0.2} };
  ws.columns = [8,15,28,15,15,15,15,15,30].map(w=>({width:w}));
  const LAST = 9;
  let R = 1;

  function shiftBlock(shiftKey, label){
    const s = state.ptr[shiftKey];
    ws.getCell(R,1).value = 'SECTOR-75, GGN — PATROL TOUR ROUND (' + label.toUpperCase() + ' SHIFT)';
    styleTitleRow(ws, R, LAST);
    ws.getRow(R).getCell(1).font = { name:'Aptos Narrow', bold:true, size:18, color:{argb:THEME.titleFont} };
    R++;

    ws.getRow(R).values = ['Date :', fmtDisplayDate(state.date), 'Site Name : Sector 75','', 'PTR Name :-', s.ptrName || '','','',''];
    ws.mergeCells(R,3,R,4);
    styleDataRow(ws, R, LAST, {bold:true, leftAlignCols:[1,2,3,5,6]});
    ws.getRow(R).eachCell(c=>{ c.font = { name:'Aptos Narrow', bold:true, size:12 }; });
    R++;
    R++;

    ws.getRow(R).values = ['S. No','Zone / Section','Area / Sub-Zone','Slot 1 — Time','Slot 2 — Time','Slot 3 — Time','Blocked Access','Poor Lighting','Remarks / Issues'];
    styleHeaderRow(ws, R, LAST); R++;

    s.zones.forEach((z,i)=>{
      ws.getRow(R).values = [z.no, z.zone, z.area, z.slot1, z.slot2, z.slot3, z.blocked, z.poorLighting, z.remarks];
      styleDataRow(ws, R, LAST, {band:i%2===1, leftAlignCols:[3,9]});
      flagCell(ws, R, 7, z.blocked);
      flagCell(ws, R, 8, z.poorLighting);
      R++;
    });
    R++;

    ws.getRow(R).values = ['Verified by:', s.verifiedBy || '________________', '', 'Updated by:', s.updatedBy || '________________'];
    styleDataRow(ws, R, LAST, {bold:true}); R++;
    ws.getRow(R).values = ['', 'Desg. Security Supervisor', '', '', 'Desg. Safety & Surveillance Officer'];
    ws.getRow(R).eachCell(c=>{ c.font = { italic:true, size:9.5, color:{argb:'FF4A5568'} }; }); R+=2;
  }

  shiftBlock('morning','Morning');
  shiftBlock('night','Night');

  await downloadWorkbook(wb, `PTR_Sector75_${state.date}.xlsx`);
  document.getElementById('statusMsg').textContent = 'Exported PTR for ' + fmtDisplayDate(state.date) + '.';
}
