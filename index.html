<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sector 75 Daily Status Report</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js"></script>
<style>
  :root{
    --ink:#1b2430; --ink-soft:#4a5568; --line:#d8dce3; --line-soft:#e8eaef;
    --paper:#f6f7f9; --panel:#ffffff; --brand:#0f4c5c; --brand-deep:#0a3540;
    --amber:#c17a1f; --amber-soft:#fbeed9; --warn:#b3431e; --radius:6px;
  }
  *{box-sizing:border-box;}
  body{ margin:0; background:var(--paper); color:var(--ink);
    font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; }
  header.top{
    background:var(--brand-deep); color:#eef3f2; padding:18px 28px;
    display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:14px;
    border-bottom:3px solid var(--amber);
  }
  header.top h1{ margin:0; font-size:19px; letter-spacing:.2px; font-weight:700; }
  header.top p{ margin:2px 0 0; font-size:12.5px; color:#b9d2cf; }
  .top-controls{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  .top-controls label{ font-size:12px; color:#cfe3e0; margin-right:4px; }
  .top-controls input[type=date], .top-controls select{
    padding:7px 9px; border-radius:5px; border:1px solid #1c5b6c; background:#0d4453; color:#fff; font-size:13px;
  }
  main{ max-width:1180px; margin:24px auto 90px; padding:0 20px; }
  section.card{ background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); margin-bottom:18px; overflow:hidden; }
  section.card > .card-head{ background:#eef3f3; padding:11px 16px; border-bottom:1px solid var(--line); }
  section.card > .card-head h2{ margin:0; font-size:13.5px; text-transform:uppercase; letter-spacing:.6px; color:var(--brand-deep); font-weight:700; }
  section.card > .card-body{ padding:16px; }
  .field-grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(190px,1fr)); gap:12px 16px; }
  .field{ display:flex; flex-direction:column; gap:4px; }
  .field label{ font-size:11.5px; color:var(--ink-soft); font-weight:600; }
  .field input{ padding:7px 9px; border:1px solid var(--line); border-radius:5px; font-size:13.5px; background:#fff; color:var(--ink); font-family:inherit; }
  .field input:focus{ outline:2px solid var(--brand); outline-offset:0; border-color:var(--brand); }
  table.grid{ width:100%; border-collapse:collapse; font-size:12.8px; min-width:640px; }
  .table-scroll{ overflow-x:auto; -webkit-overflow-scrolling:touch; border-radius:4px; }
  table.grid th{ background:#f0f2f5; color:var(--ink-soft); text-align:left; padding:7px 8px; border:1px solid var(--line-soft); font-weight:700; white-space:nowrap; }
  table.grid td{ padding:4px 6px; border:1px solid var(--line-soft); vertical-align:middle; }
  table.grid td input, table.grid td select{ width:100%; border:1px solid transparent; background:transparent; padding:5px 4px; font-size:12.8px; border-radius:4px; }
  table.grid td input:focus, table.grid td select:focus{ background:#fff; border-color:var(--brand); outline:none; }
  table.grid tr:hover td{ background:#fafbfc; }
  .computed{ font-weight:700; color:var(--brand-deep); }
  .row-actions{ text-align:center; width:36px; }
  .row-actions button{ background:none; border:none; color:var(--warn); font-size:16px; cursor:pointer; line-height:1; }
  .add-row-btn{ margin-top:10px; background:#eef3f3; border:1px dashed var(--brand); color:var(--brand-deep); padding:7px 12px; border-radius:5px; font-size:12.5px; cursor:pointer; font-weight:600; }
  .add-row-btn:hover{ background:var(--amber-soft); border-color:var(--amber); }
  footer.bar{
    position:fixed; bottom:0; left:0; right:0; background:var(--panel); border-top:1px solid var(--line);
    padding:12px 24px; display:flex; align-items:center; justify-content:space-between; gap:14px; flex-wrap:wrap;
    box-shadow:0 -2px 10px rgba(0,0,0,.04);
  }
  .bar-status{ font-size:12px; color:var(--ink-soft); }
  .bar-note{ font-size:10.5px; color:#9aa3b2; margin-top:2px; }
  .bar-actions{ display:flex; gap:10px; }
  button.primary{ background:var(--brand); color:#fff; border:none; padding:10px 20px; border-radius:5px; font-size:13.5px; font-weight:700; cursor:pointer; }
  button.primary:hover{ background:var(--brand-deep); }
  button.secondary{ background:#fff; color:var(--brand-deep); border:1px solid var(--brand); padding:10px 16px; border-radius:5px; font-size:13.5px; font-weight:600; cursor:pointer; }
  button.secondary:hover{ background:#eef3f3; }
  .note{ font-size:11.5px; color:#8a93a3; margin-top:8px; }
  .two-col{ display:grid; grid-template-columns:1fr 1fr; gap:18px; }
  @media (max-width:760px){
    .two-col{ grid-template-columns:1fr; }
    header.top{ padding:14px 16px; }
    header.top h1{ font-size:16px; }
    header.top p{ display:none; }
    .top-controls{ width:100%; }
    .top-controls > div{ flex:1 1 auto; }
    .top-controls input[type=date], .top-controls select{ width:100%; }
    main{ margin:16px auto 130px; padding:0 10px; }
    section.card > .card-body{ padding:12px; }
    .field-grid{ grid-template-columns:1fr 1fr; gap:10px 12px; }
    footer.bar{ flex-direction:column; align-items:stretch; padding:10px 14px; gap:8px; }
    .bar-status{ text-align:center; }
    .bar-actions{ flex-direction:column; }
    .bar-actions button{ width:100%; }
    table.grid{ font-size:12px; }
  }
  @media (max-width:420px){ .field-grid{ grid-template-columns:1fr; } }
</style>
</head>
<body>

<header class="top">
  <div>
    <h1>Sector 75 &mdash; Daily Status Report</h1>
    <p>Security Daily Status Report, digitised</p>
  </div>
  <div class="top-controls">
    <div>
      <label for="reportDate">Report date</label>
      <input type="date" id="reportDate">
    </div>
    <div>
      <label for="loadPrevious">Open saved</label>
      <select id="loadPrevious"><option value="">Choose a date&hellip;</option></select>
    </div>
  </div>
</header>

<main>
  <div id="panel-dsr"></div>
</main>

<footer class="bar">
  <div>
    <div class="bar-status" id="statusMsg">Draft loaded for today.</div>
    <div class="bar-note">Drafts save to this device only. Export to Excel to share a finished report with others.</div>
  </div>
  <div class="bar-actions">
    <button class="secondary" id="saveDraftBtn">Save draft</button>
    <button class="primary" id="exportBtn">Export report to Excel</button>
  </div>
</footer>

<script>
/* Storage polyfill: uses host window.storage if present, else localStorage */
if (!window.storage) {
  window.storage = {
    async get(key){
      const raw = localStorage.getItem('kvs:'+key);
      if(raw === null) throw new Error('not found');
      return { key, value: raw, shared:false };
    },
    async set(key, value){ localStorage.setItem('kvs:'+key, value); return { key, value, shared:false }; },
    async delete(key){ localStorage.removeItem('kvs:'+key); return { key, deleted:true, shared:false }; },
    async list(prefix){
      const keys = [];
      for(let i=0;i<localStorage.length;i++){
        const k = localStorage.key(i);
        if(k && k.startsWith('kvs:')){
          const bare = k.slice(4);
          if(!prefix || bare.startsWith(prefix)) keys.push(bare);
        }
      }
      return { keys, prefix, shared:false };
    }
  };
}
</script>
<script>
/* ---------------- Static template data ---------------- */
// Fire safety quantities are STATIC. To change them, edit only this list.
const FIRE_SAFETY_DEFAULTS = [
  ['Fire Alarm Panel','BMS Room',1,'Ops','-'],
  ['FHC - Ground Level','Total Cabinets',53,'Ops','-'],
  ['FHC - Ground Level','Hose Pipes',74,'Available','-'],
  ['FHC - Ground Level','Nozzles',2,'Available on Main Gate','-'],
  ['FHC - Basement','Total Cabinets',5,'Ops','-'],
  ['FHC - Basement','Hose Pipes',10,'Available','-'],
  ['FHC - Basement','Nozzles',1,'Available in BMS','-'],
  ['Fire Extinguishers','WATER 9 LTR',3,'','NEW'],
  ['Fire Extinguishers','FOAM 45 LTR',6,'','NEW'],
  ['Fire Extinguishers','FOAM 9.0 LTR',5,'','NEW'],
  ['Fire Extinguishers','DCP 2.0 KG (ABC)',5,'Refilled: Feb 2025','-'],
  ['Fire Extinguishers','DCP 4.0 KG (ABC)',13,'Refilled: Feb 2025 / Jun 2025','-'],
  ['Fire Extinguishers','DCP 6.0 KG (ABC)',10,'Refilled: Feb 2025','-'],
  ['Fire Extinguishers','CO2 22.5 KG',5,'-','-'],
  ['Fire Extinguishers','CO2 4.5 KG',35,'Refilled: Feb 2025 / Jun 2025','-'],
];
const LABOUR_COMPANIES = ['PFMPL (RSP)','MPPL','Allubuild','ANJ','APPL','MOON WALK'];
const PARKING_ROWS = ['4 Wheelers Parked','2 Wheelers Parked','4/2 W Identified','4/2 W Unidentified'];
const PARKING_COLS = ['Total Day','Total Night','Basement Day','Basement Night','Block-D Day','Block-D Night','Block-F Day','Block-F Night'];

function todayISO(){ return new Date().toISOString().slice(0,10); }
function fmtDisplayDate(iso){
  if(!iso) return '';
  const [y,m,d]=iso.split('-'); return `${d}-${m}-${y}`;
}

function defaultDSR(){
  return {
    reportPeriod:'',
    manpower:{
      morning:{ approvedSup:2, approvedGuards:38, deployedSup:'', deployedGuards:'', overtime:'' },
      night:{ approvedSup:2, approvedGuards:34, deployedSup:'', deployedGuards:'', overtime:'' },
    },
    hsd: [ {date:'',location:'',quantity:'',time:'',challan:'',vehicle:'',vendor:''} ],
    fireSafety: FIRE_SAFETY_DEFAULTS.map(r=>({equipmentType:r[0],location:r[1],quantity:r[2],status:r[3],remarks:r[4]})),
    incidents: [],
    cctv:{
      old:{ installed:54, working:54, notWorking:0, backup:'7-10 Days', remarksInstalled:'Installed & Configured', remarksWorking:'All Operational', remarksNotWorking:'Nil', remarksBackup:'Average 7 Days' },
      new:{ installed:84, working:84, notWorking:0, backup:'1 Month', remarksInstalled:'Installed & Configured', remarksWorking:'All Operational', remarksNotWorking:'Nil', remarksBackup:'Up to one month' },
    },
    labour: LABOUR_COMPANIES.map(name=>({company:name, personnel:'', labours:'', staff:''})),
    parking: PARKING_ROWS.map(()=>({ basementDay:'',basementNight:'',blockDDay:'',blockDNight:'',blockFDay:'',blockFNight:'',remarks:'' })),
    lighting:{ stp:'', nonTower:'', blockBC:'', blockD:'', blockEG:'', blockF:'', informTo:'', informBy:'', remarks:'' },
    summary:{ preparedBy:'', additionalInfo:'' },
    actionRequired: [],
  };
}

/* ---------------- App state ---------------- */
let state = { date: todayISO(), dsr: defaultDSR() };
let saveTimer = null;

function setPath(obj, path, value){
  const keys = path.split('.');
  let o = obj;
  for(let i=0;i<keys.length-1;i++){
    const k = isNaN(keys[i]) ? keys[i] : Number(keys[i]);
    o = o[k];
  }
  const lastKey = keys[keys.length-1];
  o[isNaN(lastKey)?lastKey:Number(lastKey)] = value;
}

/* ---------------- Storage ---------------- */
async function saveDraft(silent){
  try{
    await window.storage.set('dsr:'+state.date, JSON.stringify(state.dsr));
    document.getElementById('statusMsg').textContent = 'Saved draft for ' + fmtDisplayDate(state.date) + ' at ' + new Date().toLocaleTimeString();
    if(!silent) refreshLoadList();
  }catch(e){
    document.getElementById('statusMsg').textContent = 'Could not save draft: ' + e;
  }
}
function scheduleAutosave(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(()=>saveDraft(true), 900);
}
async function loadDraft(dateISO){
  let dsr = defaultDSR();
  try{
    const r = await window.storage.get('dsr:'+dateISO);
    if(r && r.value) dsr = JSON.parse(r.value);
  }catch(e){}
  // Fire safety qty is static: always take it from the template defaults
  dsr.fireSafety = FIRE_SAFETY_DEFAULTS.map((def,i)=>({
    equipmentType:def[0], location:def[1], quantity:def[2],
    status:  (dsr.fireSafety && dsr.fireSafety[i]) ? dsr.fireSafety[i].status  : def[3],
    remarks: (dsr.fireSafety && dsr.fireSafety[i]) ? dsr.fireSafety[i].remarks : def[4],
  }));
  state.date = dateISO;
  state.dsr = dsr;
  renderAll();
  document.getElementById('statusMsg').textContent = 'Loaded ' + fmtDisplayDate(dateISO) + '.';
}
async function refreshLoadList(){
  const sel = document.getElementById('loadPrevious');
  sel.innerHTML = '<option value="">Choose a date&hellip;</option>';
  try{
    const list = await window.storage.list('dsr:');
    if(list && list.keys){
      const dates = list.keys.map(k=>k.replace('dsr:','')).sort().reverse();
      dates.forEach(d=>{
        const opt = document.createElement('option');
        opt.value = d; opt.textContent = fmtDisplayDate(d);
        sel.appendChild(opt);
      });
    }
  }catch(e){}
}

/* ---------------- Rendering ---------------- */
function renderDSR(){
  const d = state.dsr;
  const n = v => Number(v)||0;
  const mm = d.manpower.morning, mn = d.manpower.night;
  const totalApprovedM = n(mm.approvedSup)+n(mm.approvedGuards);
  const totalApprovedN = n(mn.approvedSup)+n(mn.approvedGuards);
  const totalDeployedM = n(mm.deployedSup)+n(mm.deployedGuards);
  const totalDeployedN = n(mn.deployedSup)+n(mn.deployedGuards);
  const supShortM = Math.max(n(mm.approvedSup)-n(mm.deployedSup),0);
  const guardShortM = Math.max(n(mm.approvedGuards)-n(mm.deployedGuards),0);
  const supShortN = Math.max(n(mn.approvedSup)-n(mn.deployedSup),0);
  const guardShortN = Math.max(n(mn.approvedGuards)-n(mn.deployedGuards),0);

  const fireTotal = d.fireSafety.reduce((s,r)=> r.equipmentType==='Fire Extinguishers' ? s+n(r.quantity) : s, 0);
  const camTotal = n(d.cctv.old.installed)+n(d.cctv.new.installed);
  const labourTotalP = d.labour.reduce((s,r)=>s+n(r.personnel),0);
  const labourTotalL = d.labour.reduce((s,r)=>s+n(r.labours),0);
  const labourTotalS = d.labour.reduce((s,r)=>s+n(r.staff),0);

  const html = `
  <section class="card">
    <div class="card-head"><h2>Report period</h2></div>
    <div class="card-body">
      <div class="field-grid">
        <div class="field"><label>Report Period</label>
          <input type="text" placeholder="e.g. 04-Sep-2026, 06:00 to 06:00 hrs" data-bind="reportPeriod" value="${esc(d.reportPeriod)}"></div>
      </div>
    </div>
  </section>

  <section class="card">
    <div class="card-head"><h2>1. Security manpower</h2></div>
    <div class="card-body">
      <table class="grid">
        <thead><tr>
          <th>Shift</th><th>Approved Sup</th><th>Approved Guards</th><th>Total Approved</th>
          <th>Deployed Sup</th><th>Deployed Guards</th><th>Overtime</th><th>Total Deployed</th>
          <th>Sup Shortfall</th><th>Guard Shortfall</th>
        </tr></thead>
        <tbody>
          <tr>
            <td>Morning</td>
            <td><input type="number" min="0" data-bind="manpower.morning.approvedSup" value="${mm.approvedSup}"></td>
            <td><input type="number" min="0" data-bind="manpower.morning.approvedGuards" value="${mm.approvedGuards}"></td>
            <td class="computed" data-calc="totalApprovedM">${totalApprovedM}</td>
            <td><input type="number" min="0" data-bind="manpower.morning.deployedSup" value="${mm.deployedSup}"></td>
            <td><input type="number" min="0" data-bind="manpower.morning.deployedGuards" value="${mm.deployedGuards}"></td>
            <td><input type="number" min="0" data-bind="manpower.morning.overtime" value="${mm.overtime}"></td>
            <td class="computed" data-calc="totalDeployedM">${totalDeployedM}</td>
            <td class="computed" data-calc="supShortM">${supShortM}</td>
            <td class="computed" data-calc="guardShortM">${guardShortM}</td>
          </tr>
          <tr>
            <td>Night</td>
            <td><input type="number" min="0" data-bind="manpower.night.approvedSup" value="${mn.approvedSup}"></td>
            <td><input type="number" min="0" data-bind="manpower.night.approvedGuards" value="${mn.approvedGuards}"></td>
            <td class="computed" data-calc="totalApprovedN">${totalApprovedN}</td>
            <td><input type="number" min="0" data-bind="manpower.night.deployedSup" value="${mn.deployedSup}"></td>
            <td><input type="number" min="0" data-bind="manpower.night.deployedGuards" value="${mn.deployedGuards}"></td>
            <td><input type="number" min="0" data-bind="manpower.night.overtime" value="${mn.overtime}"></td>
            <td class="computed" data-calc="totalDeployedN">${totalDeployedN}</td>
            <td class="computed" data-calc="supShortN">${supShortN}</td>
            <td class="computed" data-calc="guardShortN">${guardShortN}</td>
          </tr>
          <tr>
            <td><strong>Total</strong></td>
            <td class="computed">${n(mm.approvedSup)+n(mn.approvedSup)}</td>
            <td class="computed">${n(mm.approvedGuards)+n(mn.approvedGuards)}</td>
            <td class="computed">${totalApprovedM+totalApprovedN}</td>
            <td class="computed">${n(mm.deployedSup)+n(mn.deployedSup)}</td>
            <td class="computed">${n(mm.deployedGuards)+n(mn.deployedGuards)}</td>
            <td class="computed">${n(mm.overtime)+n(mn.overtime)}</td>
            <td class="computed">${totalDeployedM+totalDeployedN}</td>
            <td class="computed">${supShortM+supShortN}</td>
            <td class="computed">${guardShortM+guardShortN}</td>
          </tr>
        </tbody>
      </table>
    </div>
  </section>

  <section class="card">
    <div class="card-head"><h2>2. HSD (fuel) report</h2></div>
    <div class="card-body">
      <table class="grid">
        <thead><tr><th>Date</th><th>Location / Details</th><th>Quantity</th><th>Time</th><th>Challan / Invoice No.</th><th>Vehicle No.</th><th>Vendor Name</th><th></th></tr></thead>
        <tbody>${d.hsd.map((r,i)=>hsdRow(r,i)).join('')}</tbody>
      </table>
      <button class="add-row-btn" id="addHsdRow">+ Add HSD entry</button>
    </div>
  </section>

  <div class="two-col">
    <section class="card">
      <div class="card-head"><h2>3. Fire safety equipment</h2></div>
      <div class="card-body">
        <table class="grid">
          <thead><tr><th>Equipment</th><th>Location</th><th>Qty</th><th>Status</th><th>Remarks</th></tr></thead>
          <tbody>
            ${d.fireSafety.map((r,i)=>fireRow(r,i)).join('')}
            <tr><td colspan="2"><strong>Total fire extinguishers</strong></td>
              <td class="computed" data-calc="fireTotal">${fireTotal}</td><td></td><td></td></tr>
          </tbody>
        </table>
      </div>
    </section>

    <section class="card">
      <div class="card-head"><h2>4. Incidents report</h2></div>
      <div class="card-body">
        <table class="grid">
          <thead><tr><th>Date &amp; time</th><th>Location</th><th>Nature</th><th>Guest / staff</th><th>Description &amp; follow-up</th><th></th></tr></thead>
          <tbody>${d.incidents.map((r,i)=>incidentRow(r,i)).join('')}</tbody>
        </table>
        <button class="add-row-btn" id="addIncidentRow">+ Add incident</button>
        ${d.incidents.length===0 ? '<p class="note">No incidents logged for this period.</p>' : ''}
      </div>
    </section>
  </div>

  <div class="two-col">
    <section class="card">
      <div class="card-head"><h2>5. CCTV surveillance system</h2></div>
      <div class="card-body">
        <table class="grid">
          <thead><tr><th>Parameter</th><th>Old system</th><th>New system</th></tr></thead>
          <tbody>
            <tr><td>Installed cameras</td>
              <td><input type="number" min="0" data-bind="cctv.old.installed" value="${d.cctv.old.installed}"></td>
              <td><input type="number" min="0" data-bind="cctv.new.installed" value="${d.cctv.new.installed}"></td></tr>
            <tr><td>Currently working</td>
              <td><input type="number" min="0" data-bind="cctv.old.working" value="${d.cctv.old.working}"></td>
              <td><input type="number" min="0" data-bind="cctv.new.working" value="${d.cctv.new.working}"></td></tr>
            <tr><td>Not working</td>
              <td><input type="number" min="0" data-bind="cctv.old.notWorking" value="${d.cctv.old.notWorking}"></td>
              <td><input type="number" min="0" data-bind="cctv.new.notWorking" value="${d.cctv.new.notWorking}"></td></tr>
            <tr><td>Recording backup</td>
              <td><input type="text" data-bind="cctv.old.backup" value="${esc(d.cctv.old.backup)}"></td>
              <td><input type="text" data-bind="cctv.new.backup" value="${esc(d.cctv.new.backup)}"></td></tr>
            <tr><td><strong>Total installed cameras</strong></td>
              <td colspan="2" class="computed" data-calc="camTotal">${camTotal}</td></tr>
          </tbody>
        </table>
      </div>
    </section>

    <section class="card">
      <div class="card-head"><h2>6. Labour movement</h2></div>
      <div class="card-body">
        <table class="grid">
          <thead><tr><th>Company</th><th>Personnel</th><th>Labours</th><th>Staff</th><th>%</th><th></th></tr></thead>
          <tbody>
            ${d.labour.map((r,i)=>labourRow(r,i,labourTotalP)).join('')}
            <tr><td><strong>Total</strong></td>
              <td class="computed" data-calc="labourTotalP">${labourTotalP}</td>
              <td class="computed" data-calc="labourTotalL">${labourTotalL}</td>
              <td class="computed" data-calc="labourTotalS">${labourTotalS}</td>
              <td class="computed">${labourTotalP>0?'100%':'0%'}</td><td></td></tr>
          </tbody>
        </table>
        <button class="add-row-btn" id="addLabourRow">+ Add company</button>
      </div>
    </section>
  </div>

  <section class="card">
    <div class="card-head"><h2>7. Parking management</h2></div>
    <div class="card-body">
      <table class="grid">
        <thead><tr><th>Parking Details</th>${PARKING_COLS.map(c=>`<th>${c}</th>`).join('')}<th>Remarks</th></tr></thead>
        <tbody>${d.parking.map((r,i)=>parkingRow(r,i)).join('')}</tbody>
      </table>
    </div>
  </section>

  <section class="card">
    <div class="card-head"><h2>8. Lighting report</h2></div>
    <div class="card-body">
      <div class="field-grid">

/* ---------------- Binding + live recompute ---------------- */
function bindInputs(container, section, rerenderFn){
  container.querySelectorAll('[data-bind]').forEach(el=>{
    const evt = (el.tagName==='SELECT') ? 'change' : 'input';
    el.addEventListener(evt, ()=>{
      setPath(state[section], el.getAttribute('data-bind'), el.value);
      scheduleAutosave();
      liveRecomputeDSR();
    });
    el.addEventListener('change', ()=>{ rerenderFn(); });
  });
}
function liveRecomputeDSR(){
  const d = state.dsr;
  const n = v => Number(v)||0;
  const mm = d.manpower.morning, mn = d.manpower.night;
  setCalc('totalApprovedM', n(mm.approvedSup)+n(mm.approvedGuards));
  setCalc('totalApprovedN', n(mn.approvedSup)+n(mn.approvedGuards));
  setCalc('totalDeployedM', n(mm.deployedSup)+n(mm.deployedGuards));
  setCalc('totalDeployedN', n(mn.deployedSup)+n(mn.deployedGuards));
  setCalc('supShortM', Math.max(n(mm.approvedSup)-n(mm.deployedSup),0));
  setCalc('guardShortM', Math.max(n(mm.approvedGuards)-n(mm.deployedGuards),0));
  setCalc('supShortN', Math.max(n(mn.approvedSup)-n(mn.deployedSup),0));
  setCalc('guardShortN', Math.max(n(mn.approvedGuards)-n(mn.deployedGuards),0));
  setCalc('fireTotal', d.fireSafety.reduce((s,r)=> r.equipmentType==='Fire Extinguishers' ? s+n(r.quantity) : s, 0));
  setCalc('camTotal', n(d.cctv.old.installed)+n(d.cctv.new.installed));
  setCalc('labourTotalP', d.labour.reduce((s,r)=>s+n(r.personnel),0));
  setCalc('labourTotalL', d.labour.reduce((s,r)=>s+n(r.labours),0));
  setCalc('labourTotalS', d.labour.reduce((s,r)=>s+n(r.staff),0));
  d.parking.forEach((r,i)=>{
    setCalc('parkTotalDay'+i,   n(r.basementDay)   + n(r.blockDDay)   + n(r.blockFDay));
    setCalc('parkTotalNight'+i, n(r.basementNight) + n(r.blockDNight) + n(r.blockFNight));
  });
}
function setCalc(name, value){
  const el = document.querySelector(`[data-calc="${name}"]`);
  if(el) el.textContent = value;
}
function esc(v){
  if(v===undefined || v===null) return '';
  return String(v).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');
}
function wrapTablesForScroll(container){
  container.querySelectorAll('table.grid').forEach(tbl=>{
    if(tbl.parentElement && tbl.parentElement.classList.contains('table-scroll')) return;
    const wrap = document.createElement('div');
    wrap.className = 'table-scroll';
    tbl.parentNode.insertBefore(wrap, tbl);
    wrap.appendChild(tbl);
  });
}

/* ---------------- Excel export (ExcelJS) ---------------- */
const THEME = {
  titleFill:'FF1F4E78', titleFont:'FFFFFFFF',
  sectionFill:'FF1F4E78', sectionFont:'FFFFFFFF',
  headerFill:'FF5B9BD5', headerFont:'FFFFFFFF',
  totalLabelFill:'FFF2F2F2', totalValueFill:'FF92D050', totalFont:'FF1B2430',
  bandFill:'FFF7F9FB',
  border:{ style:'thin', color:{argb:'FF000000'} },
  headFontName:'Calibri', dataFontName:'Aptos Narrow',
};
function thinBorder(){ return { top:THEME.border, left:THEME.border, bottom:THEME.border, right:THEME.border }; }
function solid(argb){ return { type:'pattern', pattern:'solid', fgColor:{argb} }; }

function styleTitleRow(ws, rowNum, lastCol){
  ws.mergeCells(rowNum,1,rowNum,lastCol);
  const row = ws.getRow(rowNum);
  row.height = 28;
  const cell = row.getCell(1);
  cell.font = { name:THEME.headFontName, bold:true, size:16, color:{argb:THEME.titleFont} };
  cell.fill = solid(THEME.titleFill);
  cell.alignment = { vertical:'middle', horizontal:'center' };
  cell.border = thinBorder();
  for(let c=1;c<=lastCol;c++) row.getCell(c).fill = solid(THEME.titleFill);
}
function styleSectionRow(ws, rowNum, lastCol, text){
  ws.mergeCells(rowNum,1,rowNum,lastCol);
  const row = ws.getRow(rowNum);
  row.height = 21;
  const cell = row.getCell(1);
  cell.value = text;
  cell.font = { name:THEME.headFontName, bold:true, size:11, color:{argb:THEME.sectionFont} };
  cell.fill = solid(THEME.sectionFill);
  cell.alignment = { vertical:'middle', horizontal:'center' };
  cell.border = thinBorder();
  for(let c=1;c<=lastCol;c++) row.getCell(c).fill = solid(THEME.sectionFill);
}
function styleHeaderRow(ws, rowNum, lastCol){
  const row = ws.getRow(rowNum);
  row.height = 20;
  for(let c=1;c<=lastCol;c++){
    const cell = row.getCell(c);
    cell.font = { name:THEME.headFontName, bold:true, size:11, color:{argb:THEME.headerFont} };
    cell.fill = solid(THEME.headerFill);
    cell.border = thinBorder();
    cell.alignment = { vertical:'middle', horizontal:'center', wrapText:true };
  }
}
function styleDataRow(ws, rowNum, lastCol, opts){
  opts = opts || {};
  const leftCols = opts.leftAlignCols || [];
  const row = ws.getRow(rowNum);
  for(let c=1;c<=lastCol;c++){
    const cell = row.getCell(c);
    cell.border = thinBorder();
    cell.font = Object.assign({ name:THEME.dataFontName, size:11 }, cell.font||{});
    cell.alignment = { vertical:'middle', horizontal: leftCols.includes(c) ? 'left' : 'center', wrapText:true };
    if(opts.band) cell.fill = solid(THEME.bandFill);
    if(opts.bold) cell.font = Object.assign({}, cell.font, {bold:true});
    if(opts.total){
      cell.fill = solid(c===1 ? THEME.totalLabelFill : THEME.totalValueFill);
      cell.font = Object.assign({}, cell.font, { bold:true, color:{argb:THEME.totalFont} });
    }
  }
}
async function downloadWorkbook(wb, filename){
  const buffer = await wb.xlsx.writeBuffer();
  const blob = new Blob([buffer], { type:'application/octet-stream' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
function num(v){ const x = Number(v); return isNaN(x) || v===''||v===null||v===undefined ? null : x; }
function F(formula){ return { formula }; }

async function exportDSR(){
  const d = state.dsr;
  const wb = new ExcelJS.Workbook();
  const ws = wb.addWorksheet('DSR', { views:[{ showGridLines:false }] });
  ws.pageSetup = { orientation:'landscape', fitToPage:true, fitToWidth:1, fitToHeight:0, margins:{left:0.3,right:0.3,top:0.4,bottom:0.4,header:0.2,footer:0.2} };
  ws.columns = [22,16,16,14,14,14,12,14,12,26].map(w=>({width:w}));
  const LAST = 10;
  let R = 1;

  ws.getCell(R,1).value = 'SECURITY DAILY STATUS REPORT (DSR) - SECTOR 75';
  styleTitleRow(ws, R, LAST); R++;

  ws.getCell(R,1).font = { name:'Calibri', bold:true, size:12, color:{argb:'FF1F4E78'} };
  ws.getCell(R,1).alignment = { horizontal:'right', vertical:'center' };
  ws.getCell(R,2).value = d.reportPeriod || fmtDisplayDate(state.date);
  ws.getCell(R,2).font = { name:'Calibri', bold:true, size:12, color:{argb:'FF1F4E78'} };
  ws.getCell(R,2).alignment = { horizontal:'left', vertical:'center' };
  ws.mergeCells(R,2,R,LAST); R+=2;

  // 1. Manpower
  styleSectionRow(ws, R, LAST, '1. SECURITY MANPOWER'); R++;
  ws.getRow(R).values = ['Shift','Approved Sup','Approved Guards','Total Approved','Deployed Sup','Deployed Guards','Overtime','Total Deployed','Sup Shortfall','Guard Shortfall'];
  styleHeaderRow(ws, R, LAST); R++;
  const mm = d.manpower.morning, mn = d.manpower.night;
  const mRow = R;
  ws.getRow(R).values = ['Morning', num(mm.approvedSup), num(mm.approvedGuards), F(`B${R}+C${R}`), num(mm.deployedSup), num(mm.deployedGuards), num(mm.overtime), F(`E${R}+F${R}`), F(`MAX(B${R}-E${R},0)`), F(`MAX(C${R}-F${R},0)`)];
  styleDataRow(ws, R, LAST); R++;
  const nRow = R;
  ws.getRow(R).values = ['Night', num(mn.approvedSup), num(mn.approvedGuards), F(`B${R}+C${R}`), num(mn.deployedSup), num(mn.deployedGuards), num(mn.overtime), F(`E${R}+F${R}`), F(`MAX(B${R}-E${R},0)`), F(`MAX(C${R}-F${R},0)`)];
  styleDataRow(ws, R, LAST, {band:true}); R++;
  ws.getRow(R).values = ['Total', ...'BCDEFGHIJ'.split('').map(c=>F(`SUM(${c}${mRow}:${c}${nRow})`))];
  styleDataRow(ws, R, LAST, {total:true}); R+=2;

  // 2. HSD
  styleSectionRow(ws, R, LAST, '2. HSD REPORT'); R++;
  ws.getRow(R).values = ['Date','Location / Details','Quantity','Time','Challan / Invoice No.','','Vehicle No.','','Vendor Name'];
  styleHeaderRow(ws, R, LAST); ws.mergeCells(R,5,R,6); ws.mergeCells(R,7,R,8); R++;
  const hsdRows = d.hsd.length ? d.hsd : [{}];
  hsdRows.forEach((row,i)=>{
    ws.getRow(R).values = [row.date||'', row.location||'', num(row.quantity), row.time||'', row.challan||'','', row.vehicle||'','', row.vendor||''];
    ws.mergeCells(R,5,R,6); ws.mergeCells(R,7,R,8);
    styleDataRow(ws, R, LAST, {band:i%2===1, leftAlignCols:[2]}); R++;
  });
  R++;

  // 3. Fire safety
  styleSectionRow(ws, R, LAST, '3. FIRE SAFETY EQUIPMENT'); R++;
  ws.getRow(R).values = ['Equipment Type','Location / Details','Quantity','Status','Remarks'];
  styleHeaderRow(ws, R, 5); R++;
  const fireStart = R;
  d.fireSafety.forEach((row,i)=>{
    ws.getRow(R).values = [row.equipmentType, row.location, num(row.quantity), row.status, row.remarks];
    styleDataRow(ws, R, 5, {band:i%2===1, leftAlignCols:[2,4,5]}); R++;
  });
  const fireEnd = R-1;
  ws.getRow(R).values = ['TOTAL FIRE EXTINGUISHERS','', F(`SUMIF(A${fireStart}:A${fireEnd},"Fire Extinguishers",C${fireStart}:C${fireEnd})`)];
  styleDataRow(ws, R, 5, {total:true}); R+=2;

  styleHeaderRow(ws, R, 5); R++;
  const camRow = R;
  ws.getRow(R).values = ['Installed Cameras', num(d.cctv.old.installed), d.cctv.old.remarksInstalled, num(d.cctv.new.installed), d.cctv.new.remarksInstalled];
  styleDataRow(ws, R, 5); R++;
  ws.getRow(R).values = ['Currently Working', num(d.cctv.old.working), d.cctv.old.remarksWorking, num(d.cctv.new.working), d.cctv.new.remarksWorking];
  styleDataRow(ws, R, 5, {band:true}); R++;
  ws.getRow(R).values = ['Not Working', num(d.cctv.old.notWorking), d.cctv.old.remarksNotWorking, num(d.cctv.new.notWorking), d.cctv.new.remarksNotWorking];
  styleDataRow(ws, R, 5); R++;
  ws.getRow(R).values = ['Recording Backup', d.cctv.old.backup, '', d.cctv.new.backup, ''];
  styleDataRow(ws, R, 5, {band:true}); R++;
  ws.getRow(R).values = ['Total Installed Cameras', F(`B${camRow}+D${camRow}`)];
  styleDataRow(ws, R, 5, {total:true}); R+=2;

  const labStart = R;

  styleDataRow(ws, R, 4, {total:true}); R+=2;

  // 7. Parking (Total Day / Night are formulas)
  styleSectionRow(ws, R, LAST, '7. PARKING MANAGEMENT'); R++;
  ws.getRow(R).values = ['Parking Details', ...PARKING_COLS, 'Remarks'];
  styleHeaderRow(ws, R, LAST); R++;

      num(row.blockDDay),   num(row.blockDNight),
      num(row.blockFDay),   num(row.blockFNight),
      row.remarks
    ];
    styleDataRow(ws, R, LAST, {band:i%2===1, leftAlignCols:[1,10]}); R++;
  });
  R++;

  // 8. Lighting
  styleSectionRow(ws, R, LAST, '8. LIGHTING REPORT'); R++;
  ws.getRow(R).values = ['Report Date','STP Area','Non Tower Area','Block B & C','Block D','Block E & G','Block F','Inform To','Inform By','Remarks'];
  styleHeaderRow(ws, R, LAST); R++;
  ws.getRow(R).values = [fmtDisplayDate(state.date), d.lighting.stp, d.lighting.nonTower, d.lighting.blockBC, d.lighting.blockD, d.lighting.blockEG, d.lighting.blockF, d.lighting.informTo, d.lighting.informBy, d.lighting.remarks];
  styleDataRow(ws, R, LAST); R+=2;

  // Summary
  styleSectionRow(ws, R, LAST, 'REPORT SUMMARY'); R++;
  ws.getRow(R).values = ['Report Prepared By', d.summary.preparedBy]; ws.mergeCells(R,2,R,LAST); styleDataRow(ws,R,LAST,{leftAlignCols:[2]}); R++;
  ws.getRow(R).values = ['Report Date', fmtDisplayDate(state.date)]; ws.mergeCells(R,2,R,LAST); styleDataRow(ws,R,LAST,{band:true, leftAlignCols:[2]}); R++;
  ws.getRow(R).values = ['Additional Information', d.summary.additionalInfo]; ws.mergeCells(R,2,R,LAST); styleDataRow(ws,R,LAST,{leftAlignCols:[2]}); R+=2;
  [R-4,R-3,R-2].forEach(rn=>{ ws.getRow(rn).getCell(1).font = {bold:true}; });

  // Action required
  styleSectionRow(ws, R, LAST, 'ACTION REQUIRED'); R++;
  ws.getRow(R).values = ['Complaint Description With Location','','','','','','Raised Date','Status','Remarks'];
  ws.mergeCells(R,1,R,6); styleHeaderRow(ws, R, LAST); R++;
  const actRows = d.actionRequired.length ? d.actionRequired : [{description:'Nothing outstanding'}];
  actRows.forEach((row,i)=>{
    ws.getRow(R).values = [row.description||'','','','','','', row.raisedDate||'', row.status||'', row.remarks||''];
    ws.mergeCells(R,1,R,6);
    styleDataRow(ws, R, LAST, {band:i%2===1, leftAlignCols:[1,9]}); R++;
  });

  ws.getRow(1).height = 26;
  await downloadWorkbook(wb, `DSR_Sector75_${state.date}.xlsx`);
  document.getElementById('statusMsg').textContent = 'Exported DSR for ' + fmtDisplayDate(state.date) + '.';
}

/* ---------------- Init ---------------- */
(async function init(){
  document.getElementById('reportDate').value = state.date;
  await loadDraft(state.date);
  refreshLoadList();
})();
</script>
